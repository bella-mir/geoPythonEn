name: Attach the data folder to the release

# The course data is what students need and the rest of the repository is not,
# so every release carries data/ as a single asset. The download link
# https://github.com/bella-mir/geoPythonEn/releases/latest/download/data.zip
# always points at the newest one, which is what notebooks/module_0/setup.md
# hands to students.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the data to
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zip the data folder
        run: zip -r data.zip data

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" data.zip --clobber
