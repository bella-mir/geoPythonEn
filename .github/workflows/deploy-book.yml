name: Deploy the book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the site lives under https://<user>.github.io/geoPythonEn/
  BASE_URL: /geoPythonEn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Restore the OpenStreetMap cache
        uses: actions/cache@v4
        with:
          path: cache
          key: osm-cache-${{ github.run_id }}
          restore-keys: osm-cache-

      - name: Build the book
        # --execute runs the notebooks, so the maps and tables end up in the pages
        run: uv run myst build --html --execute

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
