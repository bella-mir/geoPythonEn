[project]
name = "geopythonen"
version = "0.1.0"
description = "notebooks for geospatial analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "polyline>=2.0.4",
    "rasterio>=1.5.0",
    "rasterstats>=0.20.0",
    "requests>=2.34.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "mystmd>=1.9.0",
    "prek>=0.3.13",
    "ty>=0.0.35",
]
